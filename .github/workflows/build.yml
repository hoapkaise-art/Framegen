          package com.framegen

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private var multiplier = 2
              private var scale = 0.5f
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  fun label(s: String, size: Float = 15f): TextView {
                      val t = TextView(this)
                      t.text = s
                      t.textSize = size
                      t.setPadding(0, pad / 2, 0, pad / 2)
                      return t
                  }

                  root.addView(label("FrameGen", 30f))
                  root.addView(label("Makes games look smoother by creating extra frames between the real ones. Works on top of any game."))
                  status = label("")
                  root.addView(status)

                  root.addView(label("Frames per real frame", 17f))
                  root.addView(radios(listOf("2x", "3x", "4x"), 0) { multiplier = it + 2 })

                  root.addView(label("Quality / speed", 17f))
                  root.addView(radios(listOf("Sharp", "Balanced", "Fast"), 1) {
                      scale = when (it) { 0 -> 0.75f; 1 -> 0.5f; else -> 0.35f }
                  })

                  val setup = Button(this)
                  setup.text = "1. Turn on overlay service"
                  setup.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  root.addView(setup)

                  val start = Button(this)
                  start.text = "2. Start"
                  start.setOnClickListener { startCaptureFlow() }
                  root.addView(start)

                  val stop = Button(this)
                  stop.text = "Stop"
                  stop.setOnClickListener {
                      startService(Intent(this, FrameGenService::class.java).setAction(FrameGenService.ACTION_STOP))
                      updateStatus()
                  }
                  root.addView(stop)

                  root.addView(label(
                      "How to use:\n" +
                      "1. Open the game first, then come back here.\n" +
                      "2. Tap Start. In the Android prompt choose 'Share one app' (NOT 'Entire screen') and pick your game.\n" +
                      "3. Switch to the game. Smoothed frames appear on top.\n\n" +
                      "Best when the game runs at 30 FPS on a 60/90/120 Hz screen. If the game already fills your screen's refresh rate there is nothing to add, so the tool passes frames straight through."
                  ))

                  setContentView(ScrollView(this).also { it.addView(root) })
              }

              override fun onResume() {
                  super.onResume()
                  updateStatus()
              }

              private fun updateStatus() {
                  val a = OverlayAccessibilityService.instance != null
                  status.text = "Overlay service: " + (if (a) "ON" else "OFF - tap button 1") +
                      "\nFrame generation: " + (if (FrameGenService.running) "RUNNING" else "stopped")
              }

              private fun radios(options: List<String>, selected: Int, onPick: (Int) -> Unit): RadioGroup {
                  val g = RadioGroup(this)
                  g.orientation = RadioGroup.HORIZONTAL
                  val ids = ArrayList<Int>()
                  options.forEachIndexed { i, s ->
                      val rb = RadioButton(this)
                      rb.text = s
                      rb.id = View.generateViewId()
                      ids.add(rb.id)
                      g.addView(rb)
                      if (i == selected) g.check(rb.id)
                  }
                  g.setOnCheckedChangeListener { _, id -> onPick(ids.indexOf(id)) }
                  return g
              }

              private fun startCaptureFlow() {
                  if (OverlayAccessibilityService.instance == null) {
                      Toast.makeText(this, "Turn on the FrameGen overlay service first", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  startActivityForResult(mpm.createScreenCaptureIntent(), 100)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 100 && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, FrameGenService::class.java)
                      i.putExtra("code", resultCode)
                      i.putExtra("data", data)
                      i.putExtra("mult", multiplier)
                      i.putExtra("scale", scale)
                      startForegroundService(i)
                      Toast.makeText(this, "Started. Switch to your game now.", Toast.LENGTH_LONG).show()
                      moveTaskToBack(true)
                  }
              }
          }
